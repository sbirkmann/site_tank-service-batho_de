server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted Build-Ausgabe (Bilder, CSS, JS) darf lange gecacht werden.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Statische Seiten als Verzeichnisse (/leistungen/tankreinigung/), eigene 404-Seite.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
